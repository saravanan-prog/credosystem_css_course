<html>
    <head>
        <title>height/width</title>
    </head>
    <body>
        <div class="container">
            <div class="box"></div>
        </div>
    </body>
    <style>
       .container{
            width:200px;
            background:green;
        }

        .box{
            width:calc(100% - 200px);
            height:100px;
            background:blue;
        }
            </style>
</html>
